<style>
:root{--navy:#1B2A41;--gold:#C8A96A;--bg:#F4F5F7;--line:#DDE1E7;--muted:#5B6678;--ok:#1E7B45;--okb:#E3F4EA;--warn:#7A5600;--warnb:#FFF4D6;--bad:#B3261E;--badb:#FCE4E2;--off:#4A5260;--offb:#E6E8EC;--info:#1F4E8C;--infob:#E4ECF8}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Nastaliq Urdu",sans-serif;background:var(--bg);color:var(--navy);font-size:15px;line-height:1.6;padding-bottom:80px}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;display:flex;align-items:center;gap:6px;padding:8px 10px}
.brand{display:flex;align-items:center;gap:6px;font-weight:700;letter-spacing:1px}
header select{background:#24375a;color:#fff;border:1px solid #3a4f75;border-radius:8px;padding:4px 6px;font:inherit;font-size:13px;max-width:115px;width:auto}
.sp{flex:1}
.bell{position:relative;background:none!important;padding:4px 6px!important;font-size:19px}
.bell b{position:absolute;top:-3px;inset-inline-end:-3px;background:var(--gold);color:var(--navy);border-radius:9px;font-size:11px;padding:0 5px}
main{padding:12px;max-width:820px;margin:auto}
h2{font-size:18px;margin:6px 0 10px}h3{font-size:15px;margin:14px 0 6px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer}
.kpi .n{font-size:24px;font-weight:700}.kpi .l{font-size:12px;color:var(--muted)}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.t{font-weight:600}.sub{font-size:12px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.g{background:var(--okb);color:var(--ok)}.y{background:var(--warnb);color:var(--warn)}.r{background:var(--badb);color:var(--bad)}.x{background:var(--offb);color:var(--off)}.i{background:var(--infob);color:var(--info)}.gold{background:#F6EEDC;color:#6B5320}
button,.btn{font:inherit;border:0;border-radius:10px;padding:9px 14px;background:var(--navy);color:#fff;cursor:pointer;font-weight:600;display:inline-block}
.sec{background:#fff;color:var(--navy);border:1px solid var(--line)}
button.gold{background:var(--gold);color:var(--navy)}
.danger{background:var(--bad);color:#fff}
.sm{padding:5px 10px;font-size:13px}
input,select,textarea{font:inherit;width:100%;padding:9px 10px;border:1px solid #A5ADBB;border-radius:9px;background:#fff;color:var(--navy)}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 3px}
label.btn{display:inline-block;margin:0;font-size:14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.chip{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:20px;padding:5px 12px;font-size:13px;white-space:nowrap;font-weight:500}
.chip.on{background:var(--navy);color:#fff}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:4px 2px calc(4px + env(safe-area-inset-bottom));z-index:5}
nav button{background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;font-size:10.5px;padding:3px 1px;font-weight:500;flex:1;border-radius:0}
nav button span{font-size:19px;line-height:1.25}
nav button.on{color:var(--navy);font-weight:700}
#modal{position:fixed;inset:0;background:rgba(10,18,32,.5);display:none;z-index:10;align-items:flex-end;justify-content:center}
#modal.open{display:flex}
#sheet{background:var(--bg);width:100%;max-width:820px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 14px 28px}
#toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:8px 14px;border-radius:10px;display:none;z-index:20;font-size:14px;max-width:90%;text-align:center}
.tl{border-inline-start:3px solid var(--line)}.tl div{margin-bottom:6px;font-size:13px}
.timer{font-variant-numeric:tabular-nums}
.photos img{width:72px;height:72px;object-fit:cover;border-radius:8px;margin:2px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:start}
.err{color:var(--bad);font-size:13px;min-height:1em}
.sim{border:1px dashed var(--gold)}
.printhead,#printArea{display:none}
@media print{header,nav,#toast,.noprint,button,label.btn{display:none!important}body{background:#fff;padding:0}.card,.item{break-inside:avoid;border-color:#999}.printhead{display:block;margin-bottom:10px}main{max-width:none}body.printing>*:not(#printArea){display:none!important}body.printing #printArea{display:block!important}@page{size:A4;margin:14mm}}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>

function formM(title,fields,fn,arg){window._form={fields,fn,arg};showM(`<div class="row"><h2 style="flex:1">${title}</h2>${closeX}</div>${fields.map(f=>`<label>${f.lb}${f.req?' *':''}</label>${f.opts?`<select id="g_${f.id}">${f.opts.map(([v,l])=>`<option value="${esc(v)}"${v==f.val?' selected':''}>${esc(l)}</option>`).join('')}</select>`:f.type==='area'?`<textarea id="g_${f.id}" rows="3">${esc(f.val||'')}</textarea>`:`<input id="g_${f.id}" type="${f.type||'text'}" ${f.type==='number'?'inputmode="decimal"':''} value="${esc(f.val??'')}">`}`).join('')}<div class="err" id="gE"></div><div class="row" style="margin-top:10px"><button onclick="formSave()">${t('save')}</button><button class="sec" onclick="closeM()">${t('cancel')}</button></div>`)}
function formSave(){const {fields,fn,arg}=window._form,v={};for(const f of fields){const x=$('#g_'+f.id).value.trim();if(f.req&&!x){$('#gE').textContent=t('need_fields');return}v[f.id]=f.type==='number'?(x===''?0:+x):x}const r=fn(v,arg);if(typeof r==='string'){$('#gE').textContent=r;return}save();closeM();render();toast(t('saved'));if(r&&r.open)openTk(r.open)}

function newTicket({title,desc,asset,prio,source,rule,by}){const sl=S.sla[prio];const tk={id:uid(),ref:nextRef('TK'),title,desc:desc||'',asset,prio,source,rule:rule||'',status:'new',createdAt:now(),by,assignee:null,respondedAt:null,startedAt:null,doneAt:null,doneBy:null,closedAt:null,slaSnap:{resp:sl[0],res:sl[1]},events:[],photos:{b:[],a:[]},rejects:0,reopens:0,sig:1,escR:0,escS:0};S.tickets.unshift(tk);ev(tk,'created',by);notify('created',tk.ref,'assign');return tk}
function escCheck(){let ch=0;S.tickets.forEach(x=>{if(!isOpen(x))return;if(!x.respondedAt&&now()>rd(x)&&!x.escR){x.escR=1;notify('escalated',x.ref,'assign');ch=1}if(!x.doneAt&&now()>sd(x)&&!x.escS){x.escS=1;notify('escalated',x.ref,'assign');ch=1}});if(ch){save();updBell()}}
function updBell(){const n=myNotifs().filter(x=>!x.read.includes(S.user)).length;$('#bellN').textContent=n||''}

function render(){const h=document.documentElement;h.lang=S.lang;h.dir=S.lang==='en'?'ltr':'rtl';$('#langSel').value=S.lang;
$('#userSel').innerHTML=S.users.map(u=>`<option value="${u.id}"${u.id===S.user?' selected':''}>${esc(u.name)}</option>`).join('');updBell();
const nv=[['home','🏠','nav_home'],['tickets','🛠️','nav_tk'],['assets','🏢','nav_as'],['sensors','📡','nav_sn'],['store','📦','nav_st'],['buy','🛒','nav_pr'],['more','☰','nav_more']];
$('#nav').innerHTML=nv.map(([v,i,k])=>`<button class="${ui.view===v?'on':''}" onclick="go('${v}')"><span>${i}</span>${t(k)}</button>`).join('');
$('#app').innerHTML=(STORE_OK?'':`<div class="card r">${t('no_storage')}</div>`)+(V[ui.view]||V.home)();tick()}
function go(v,f){ui.view=v;if(f)ui.f=f;closeM();render();scrollTo(0,0)}

const kpi=(n,k,on,c)=>`<div class="kpi" onclick="${on}"><div class="n" style="color:${c==='r'?'var(--bad)':c==='y'?'var(--warn)':'inherit'}">${n}</div><div class="l">${t(k)}</div></div>`;
function pendingList(){const L=[],P=(c,lb,ref,txt,g)=>{if(c)L.push({lb,ref,txt,g})};
vis().forEach(x=>{if(x.status==='new')P(can('assign'),t('assign'),x.ref,x.title,`openTk('${x.id}')`);if(x.status==='pending_verify')P(can('approve_close')&&x.doneBy!==S.user,t('approve_close'),x.ref,x.title,`openTk('${x.id}')`)});
S.irs.forEach(r=>{if(r.status==='requested')P(can('approve_issue'),t('approve'),r.ref,itemN(r.item)+' × '+r.qty,"go('store')");if(r.status==='reserved')P(can('issue'),t('issue'),r.ref,itemN(r.item)+' × '+r.qty,"go('store')")});
S.prs.forEach(r=>{if(r.status==='submitted')P(can('approve_pr'),t('approve'),r.ref,itemN(r.item)+' × '+r.qty,"go('buy')");if(r.status==='approved')P(can('create_po'),t('create_po'),r.ref,itemN(r.item)+' × '+r.qty,"go('buy')")});
S.pos.forEach(o=>{if(o.status==='issued'||o.status==='partial')P(can('receive'),t('receive'),o.ref,itemN(o.item)+' × '+(o.qty-o.received),"go('buy')")});return L}
function tkItem(x){return `<div class="item" onclick="openTk('${x.id}')"><div class="row"><span class="t">${esc(x.ref)}</span><span class="badge ${prCls[x.prio]}">${t('p_'+x.prio)}</span><span class="badge ${stCls[x.status]}">${t('st_'+x.status)}</span>${x.reopens?`<span class="badge r">${t('ev_reopened')}</span>`:''}${x.source==='sensor'?`<span class="badge x">📡 ${t('src_sensor')}</span>`:''}</div><div>${esc(x.title)}</div><div class="sub">${esc(assetN(x.asset))}${x.assignee?' · '+esc(uname(x.assignee)):''}</div>${isOpen(x)?`<div class="row" style="margin-top:4px">${x.respondedAt?'':timer(t('resp_due'),rd(x),0)}${timer(t('res_due'),sd(x),x.doneAt)}</div>`:''}</div>`}
function aState(id){const ss=S.sensors.filter(s=>s.asset===id).map(s=>s.state);if(ss.includes('red'))return 'red';if(ss.includes('gray'))return 'gray';if(ss.includes('yellow'))return 'yellow';if(S.tickets.some(x=>x.asset===id&&isOpen(x)))return 'maint';return 'green'}
const stBadge=s=>`<span class="badge ${sCls[s]}">${t(s==='maint'?'a_maint':'s_'+s)}</span>`;

const V={
home(){const tk=vis(),open=tk.filter(isOpen),od=open.filter(late),sc=st=>S.sensors.filter(x=>x.state===st).length,low=S.items.filter(i=>totOn(i.id)<i.min).length,pend=pendingList(),mine=open.filter(x=>x.assignee===S.user).sort(byUrg);
return `<h2>${esc(S.facility)}</h2><div class="grid">${kpi(open.length,'open_t',"go('tickets','open')")}${kpi(od.length,'overdue',"go('tickets','overdue')",od.length?'r':'')}${kpi(sc('red'),'sn_red',"go('sensors')",sc('red')?'r':'')}${kpi(sc('yellow'),'sn_yel',"go('sensors')",sc('yellow')?'y':'')}${kpi(sc('gray'),'sn_gray',"go('sensors')")}${kpi(low,'low_stock',"go('store')",low?'y':'')}${kpi(pend.length,'pending',"document.getElementById('pend').scrollIntoView()")}${can('evaluate')||can('print')?kpi('📊','reports',"go('reports')"):''}</div>
<h3>${t('my_tasks')}</h3>${mine.length?mine.map(tkItem).join(''):noneC()}
<h3 id="pend">${t('pending')}</h3>${pend.length?pend.map(p=>`<div class="item" onclick="${p.g}"><div class="row"><span class="badge gold">${esc(p.lb)}</span><span class="t">${esc(p.ref)}</span></div><div class="sub">${esc(p.txt)}</div></div>`).join(''):noneC()}`},
tickets(){const fs=['open','overdue','new','pending_verify','closed','all'];let L=vis();const f=ui.f,q=ui.q.trim();
if(f==='open')L=L.filter(isOpen);else if(f==='overdue')L=L.filter(x=>isOpen(x)&&late(x));else if(f!=='all')L=L.filter(x=>x.status===f);
if(q)L=L.filter(x=>(x.ref+' '+x.title+' '+assetN(x.asset)).toLowerCase().includes(q.toLowerCase()));
return `<div class="row"><h2 style="flex:1">${t('nav_tk')}</h2>${can('create_ticket')?`<button onclick="tkForm()">+ ${t('new_tk')}</button>`:''}</div><input id="q" placeholder="${t('search')}" value="${esc(ui.q)}" oninput="ui.q=this.value;clearTimeout(window._qt);window._qt=setTimeout(()=>{render();const i=$('#q');i.focus();i.setSelectionRange(i.value.length,i.value.length)},400)" style="margin-bottom:8px"><div class="chips">${fs.map(x=>`<button class="chip ${f===x?'on':''}" onclick="ui.f='${x}';render()">${t(x==='open'?'open_t':x==='overdue'||x==='all'?x:'st_'+x)}</button>`).join('')}</div>${L.length?L.sort((a,b)=>isOpen(a)&&isOpen(b)?byUrg(a,b):b.createdAt-a.createdAt).map(tkItem).join(''):noneC()}`},
assets(){const cats=[['visitor','c_visitor'],['service','c_service'],['equip','c_equip']],L=S.assets.filter(a=>a.cat===ui.cat);
return `<div class="row"><h2 style="flex:1">${t('nav_as')}</h2>${can('*')?`<button class="sm" onclick="assetForm()">+ ${t('add_asset')}</button>`:''}</div><div class="chips">${cats.map(([c,k])=>`<button class="chip ${ui.cat===c?'on':''}" onclick="ui.cat='${c}';render()">${t(k)}</button>`).join('')}</div>${L.map(a=>`<div class="item" onclick="assetM('${a.id}')"><div class="row"><span class="t" style="flex:1">${esc(a.name)}</span>${stBadge(aState(a.id))}</div><div class="sub">${esc(a.code)} · ${esc(a.type)} · ${esc(a.loc)}</div></div>`).join('')||noneC()}`},
sensors(){return `<h2>${t('nav_sn')}</h2><div class="card sim"><span class="badge gold">${t('sim')}</span> <span class="sub">${t('sim_note')}</span></div>${S.sensors.map(sn=>{const val=sn.state==='gray'?t('no_read'):esc(sn.val)+(sn.unit?' '+sn.unit:'');return `<div class="card"><div class="row"><span class="t" style="flex:1">${esc(sn.name)}</span>${stBadge(sn.state)}</div><div class="sub">${esc(assetN(sn.asset))} · ${t('last_read')}: ${val} · ${t('last_conn')}: ${fmt(sn.last)}</div>${sn.code&&sn.state!=='gray'?`<div class="sub">${t('code')}: ${esc(sn.code)} – ${esc(codeDesc(sn))}</div>`:''}${can('sim')?`<div class="row" style="margin-top:6px">${simBtns(sn)}</div>`:''}</div>`}).join('')}
<h3>${t('recent')}</h3><div class="card"><table>${S.readings.slice(0,20).map(r=>`<tr><td>${fmt(r.ts,{timeStyle:'medium'})}</td><td>${esc(snN(r.sid))}</td><td>${stBadge(r.state)}</td><td>${r.state==='gray'?'—':esc(r.val)} ${esc(r.code)}</td></tr>`).join('')||`<tr><td>${t('none')}</td></tr>`}</table></div>`},
store(){const irs=S.irs.filter(r=>['requested','reserved'].includes(r.status));
return `<div class="row"><h2 style="flex:1">${t('nav_st')}</h2>${can('*')?`<button class="sm" onclick="itemForm()">+ ${t('add_item')}</button>`:''}</div><div class="sub" style="margin-bottom:8px">${S.warehouses.map(w=>esc(w.name)).join(' · ')}</div>${S.items.map(i=>{const on=totOn(i.id),rs=totRes(i.id);return `<div class="item" onclick="itemM('${i.id}')"><div class="row"><span class="t" style="flex:1">${esc(i.name)}</span>${on<i.min?`<span class="badge y">${t('low')}</span>`:''}</div><div class="sub">${esc(i.code)} · ${t('onhand')} ${on} · ${t('reserved')} ${rs} · ${t('avail')} <b>${on-rs}</b> ${esc(i.unit)}</div></div>`}).join('')}
<h3>${t('issue_reqs')}</h3>${irs.length?irs.map(irRow).join(''):noneC()}<h3>${t('ledger')}</h3><div class="card"><table>${S.ledger.slice(0,15).map(l=>`<tr><td>${fmt(l.ts,{dateStyle:'short'})}</td><td>${esc(itemN(l.item))}</td><td>${esc(whN(l.wh))}</td><td style="color:${l.qty<0?'var(--bad)':'var(--ok)'}">${l.qty>0?'+':''}${l.qty}</td><td>${t('mv_'+l.type)}</td></tr>`).join('')}</table></div>`},
buy(){return `<div class="row"><h2 style="flex:1">${t('nav_pr')}</h2>${can('request_part')||can('approve_pr')?`<button class="sm" onclick="prForm()">+ ${t('new_pr')}</button>`:''}</div><h3>${t('prs')}</h3>${S.prs.length?S.prs.map(prRow).join(''):noneC()}<h3>${t('pos')}</h3>${S.pos.length?S.pos.map(poRow).join(''):noneC()}<h3>${t('f_supplier')}</h3><div class="card">${S.suppliers.map(s=>esc(s.name)).join('<br>')}</div>`},
reports(){if(!can('evaluate')&&!can('print'))return `<div class="card">${t('no_perm')}</div>`;return `<div class="row noprint"><h2 style="flex:1">${t('reports')}</h2>${can('print')?`<button onclick="printRep()">🖨 ${t('print')}</button>`:''}</div>${perBar()}${repHTML()}`},
more(){const adm=can('*'),ab=(f,k)=>`<button class="sec sm" onclick="${f}()">${t(k)}</button>`;
return `<div class="card"><div style="display:flex;align-items:center;gap:10px">${logo(46,'#1B2A41')}<div><b style="font-size:20px;letter-spacing:2px">DARIA</b><div class="sub">${esc(S.facility)}</div></div></div></div>
${can('evaluate')||can('print')?`<button class="sec" style="width:100%;margin-bottom:10px" onclick="go('reports')">📊 ${t('reports')} / ${t('eval')}</button>`:''}
<div class="card"><h3>${t('settings')}</h3><label>${t('lang')}</label><select onchange="setLang(this.value)">${[['ar','العربية'],['en','English'],['ur','اردو']].map(([v,l])=>`<option value="${v}"${S.lang===v?' selected':''}>${l}</option>`).join('')}</select><label>${t('user')}</label><select onchange="setUser(this.value)">${S.users.map(u=>`<option value="${u.id}"${u.id===S.user?' selected':''}>${esc(u.name)}</option>`).join('')}</select><div class="sub">${t('role')}: ${esc((S.roles[me().role]||{}).name)}</div>${adm?`<div class="row" style="margin-top:10px">${ab('facForm','edit_fac')}${ab('whForm','edit_wh')}${ab('userForm','add_user')}${ab('slaForm','sla_btn')}${ab('wForm','weights')}</div>`:''}</div>
${adm?`<div class="card"><h3>${t('backup')}</h3><div class="sub">${t('backup_note')}</div><div class="row" style="margin-top:8px"><button onclick="exportB()">⬇ ${t('backup')}</button><label class="btn sec">⬆ ${t('restore')}<input type="file" accept=".json,application/json" hidden onchange="importB(this)"></label><button class="danger" onclick="resetD()">${t('reset')}</button></div></div>
<div class="card"><h3>${t('audit')}</h3><table>${S.audit.slice(0,40).map(a=>`<tr><td>${fmt(a.ts,{dateStyle:'short',timeStyle:'short'})}</td><td>${esc(uname(a.u))}</td><td>${t('ev_'+a.a)}</td><td>${esc(a.ref)}</td></tr>`).join('')}</table></div>`:''}
<div class="card sub">${t('limits')}</div>`}};

function tkForm(aid){if(!guard('create_ticket'))return;formM(t('new_tk'),[{id:'ti',lb:t('f_title'),req:1},{id:'a',lb:t('f_asset'),opts:S.assets.map(a=>[a.id,a.code+' – '+a.name]),val:aid},{id:'p',lb:t('f_prio'),opts:PRI.map(p=>[p,t('p_'+p)]),val:'medium'},{id:'d',lb:t('f_desc'),type:'area'}],v=>{const x=newTicket({title:v.ti,desc:v.d,asset:v.a,prio:v.p,source:'manual',by:S.user});return {open:x.id}})}
const canWork=x=>(can('work')&&x.assignee===S.user)||can('*');
const photoBtn=(id,k)=>`<label class="btn sec">📷 ${t(k==='a'?'add_photo_a':'add_photo_b')}<input type="file" accept="image/*" capture="environment" hidden onchange="addPhoto('${id}','${k}',this)"></label>`;
function tkBody(x){return `<div class="card"><div class="row"><span class="badge ${prCls[x.prio]}">${t('p_'+x.prio)}</span><span class="badge ${stCls[x.status]}">${t('st_'+x.status)}</span><span class="badge x">${t('src_'+x.source)}</span>${x.sig>1?`<span class="badge y">${t('ev_signal')} ×${x.sig}</span>`:''}${x.reopens?`<span class="badge r">${t('ev_reopened')} ×${x.reopens}</span>`:''}</div><div style="margin-top:6px;font-weight:700">${esc(x.title)}</div>${x.desc?`<div>${esc(x.desc)}</div>`:''}<div class="sub">${t('f_asset')}: ${esc(assetN(x.asset))} · ${esc(assetLoc(x.asset))}</div><div class="sub">${t('created')}: ${fmt(x.createdAt)}${x.assignee?' · '+t('f_assignee')+': '+esc(uname(x.assignee)):''}</div><div class="row" style="margin-top:6px">${timer(t('resp_due'),rd(x),x.respondedAt)}${timer(t('res_due'),sd(x),x.doneAt)}</div><table style="margin-top:6px"><tr><td>${t('ev_responded')}</td><td>${fmt(x.respondedAt)}</td></tr><tr><td>${t('ev_started')}</td><td>${fmt(x.startedAt)}</td></tr><tr><td>${t('ev_submitted')}</td><td>${fmt(x.doneAt)}</td></tr><tr><td>${t('ev_closed')}</td><td>${fmt(x.closedAt)}</td></tr></table></div>`}
const tlHTML=x=>`<div class="card tl">${x.events.slice().reverse().map(e=>`<div><b>${t('ev_'+e.type)}</b>${e.text?' – '+esc(e.text):''}<div class="sub">${fmt(e.ts)} · ${esc(uname(e.by))}</div></div>`).join('')}</div>`;
function openTk(id){const x=gT(id);if(!x||!visT(x))return;const w=canWork(x),A=[];
if(x.status==='new'&&can('assign'))A.push(`<label>${t('f_assignee')}</label><div class="row"><select id="aU" style="flex:1">${techs().map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select><button onclick="doAssign('${id}')">${t('assign')}</button></div>`);
if(x.status==='assigned'&&w)A.push(`<div class="row">${x.respondedAt?'':`<button class="sec" onclick="doResp('${id}')">${t('respond')}</button>`}<button onclick="doStart('${id}')">${t('start')}</button></div>`);
if(x.status==='in_progress'&&w)A.push(`<button class="sec" onclick="partForm('${id}')">🔩 ${t('req_part')}</button><label>${t('f_note')} *</label><textarea id="dN" rows="2"></textarea><button class="gold" style="margin-top:6px" onclick="doSubmit('${id}')">${t('submit_done')}</button>`);
if(x.status==='pending_verify'&&can('approve_close'))A.push(`<label>${t('f_reason')} (${t('reject')})</label><input id="rjR"><div class="row" style="margin-top:6px"><button onclick="doClose('${id}')">${t('approve_close')}</button><button class="danger" onclick="doReject('${id}')">${t('reject')}</button></div>`);
if(x.status==='closed'&&can('reopen'))A.push(`<label>${t('f_reason')}</label><input id="roR"><button class="sec" style="margin-top:6px" onclick="doReopen('${id}')">${t('reopen')}</button>`);
if(isOpen(x)&&can('*'))A.push(`<details style="margin-top:8px"><summary class="sub">${t('cancel_tk')}</summary><input id="cnR" placeholder="${t('f_reason')}"><button class="danger sm" style="margin-top:6px" onclick="doCancel('${id}')">${t('cancel_tk')}</button></details>`);
const parts=S.irs.filter(r=>r.ticket===id).map(r=>`<tr><td>${esc(r.ref)}</td><td>${esc(itemN(r.item))}</td><td>${r.qty}</td><td>${esc(whN(r.wh))}</td><td><span class="badge ${irCls[r.status]}">${t('ir_'+r.status)}</span></td></tr>`).join('')+S.prs.filter(r=>r.ticket===id).map(r=>`<tr><td>${esc(r.ref)}</td><td>${esc(itemN(r.item))}</td><td>${r.qty}</td><td>${t('shortage')}</td><td><span class="badge ${prsCls[r.status]}">${t('pr_'+r.status)}</span></td></tr>`).join('');
const ph=k=>x.photos[k].map(p=>`<img src="${p.d}" alt="">`).join('')||'—';
showM(`<div class="row"><h2 style="flex:1">${esc(x.ref)}</h2>${can('print')?`<button class="sec sm" onclick="printTk('${id}')">🖨 ${t('print')}</button>`:''}${closeX}</div>${tkBody(x)}${A.length?`<div class="card">${A.join('')}</div>`:''}${w&&isOpen(x)?`<div class="row" style="margin-bottom:8px">${photoBtn(id,'b')}${photoBtn(id,'a')}</div>`:''}
<h3>${t('photos')}</h3><div class="card photos"><div class="sub">${t('add_photo_b')}</div>${ph('b')}<div class="sub">${t('add_photo_a')}</div>${ph('a')}</div><h3>${t('parts')}</h3><div class="card">${parts?`<table>${parts}</table>`:t('none')}</div><h3>${t('events')}</h3>${tlHTML(x)}`)}
function done(id){save();render();openTk(id)}
function doAssign(id){if(!guard('assign'))return;const x=gT(id),u=$('#aU').value;if(x.status!=='new'||!u)return;x.assignee=u;x.status='assigned';ev(x,'assigned',S.user,uname(u));notify('assigned',x.ref,null,u);done(id)}
function doResp(id){const x=gT(id);if(!canWork(x)||x.respondedAt)return;x.respondedAt=now();ev(x,'responded');done(id)}
function doStart(id){const x=gT(id);if(!canWork(x)||x.status!=='assigned')return;if(!x.respondedAt){x.respondedAt=now();ev(x,'responded')}x.startedAt=x.startedAt||now();x.status='in_progress';ev(x,'started');done(id)}
function doSubmit(id){const x=gT(id);if(!canWork(x)||x.status!=='in_progress')return;const n=$('#dN').value.trim();if(!x.photos.a.length){toast(t('need_photo'));return}if(!n){toast(t('need_note'));return}x.doneAt=now();x.doneBy=S.user;x.status='pending_verify';ev(x,'submitted',S.user,n);notify('submitted',x.ref,'approve_close');done(id)}
function doClose(id){if(!guard('approve_close'))return;const x=gT(id);if(x.status!=='pending_verify')return;if(x.doneBy===S.user){toast(t('sep_rule'));return}x.closedAt=now();x.status='closed';ev(x,'closed');done(id)}
function doReject(id){if(!guard('approve_close'))return;const x=gT(id),r=$('#rjR').value.trim();if(x.status!=='pending_verify')return;if(!r){toast(t('need_reason'));return}x.rejects++;x.doneAt=null;x.status='in_progress';ev(x,'rejected',S.user,r);notify('rejected',x.ref,null,x.assignee);done(id)}
function doReopen(id){if(!guard('reopen'))return;const x=gT(id),r=$('#roR').value.trim();if(x.status!=='closed')return;if(!r){toast(t('need_reason'));return}x.reopens++;x.doneAt=null;x.closedAt=null;x.status='assigned';ev(x,'reopened',S.user,r);notify('reopened',x.ref,null,x.assignee);done(id)}

function codeDesc(sn){const c=S.codes.find(x=>x.model===sn.model&&x.code===sn.code);return c?c.desc:t('code_unknown')}
function simBtns(sn){const b=(a,k,c)=>`<button class="sm ${c||'sec'}" onclick="${a}">${t(k)}</button>`;if(sn.state==='gray')return b(`sim('${sn.id}','on')`,'sim_on');return b(`sim('${sn.id}','normal')`,'sim_normal')+b(`sim('${sn.id}','anom')`,'sim_anom')+(sn.type==='status'?b(`codeM('${sn.id}')`,'sim_fault','danger'):b(`sim('${sn.id}','fault')`,sn.type==='leak'?'sim_leak':'sim_fault','danger'))+b(`sim('${sn.id}','off')`,'sim_off')}
function codeM(id){const sn=S.sensors.find(x=>x.id===id),cs=S.codes.filter(c=>c.model===sn.model);showM(`<div class="row"><h2 style="flex:1">${t('code')} – ${esc(sn.name)}</h2>${closeX}</div>${cs.map(c=>`<button class="sec" style="width:100%;margin-bottom:6px;text-align:start" onclick="sim('${id}','fault','${c.code}')">${esc(c.code)} – ${esc(c.desc)}</button>`).join('')}<button class="sec" style="width:100%;margin-bottom:6px;text-align:start" onclick="sim('${id}','fault','E99')">E99 – ${t('code_unknown')}</button><button class="sec" style="width:100%" onclick="sim('${id}','fault','')">${t('no_code')}</button>`)}
function rec(sn){S.readings.unshift({ts:now(),sid:sn.id,state:sn.state,val:sn.state==='gray'?'':sn.val,code:sn.state==='red'?sn.code:''});if(S.readings.length>400)S.readings.length=400}
function sim(id,a,code){if(!guard('sim'))return;const sn=S.sensors.find(x=>x.id===id);
if(a==='off'){if(sn.state==='gray')return;sn.prev=sn.state;sn.state='gray';rec(sn);notify('offline',sn.name,'sim');audit('offline',sn.name)}
else if(a==='on'){if(sn.state!=='gray')return;sn.state=sn.prev||'green';sn.last=now();rec(sn);toast(t('reconn_note'))}
else{if(sn.state==='gray'){toast(t('reconnect_first'));return}sn.state=a==='normal'?'green':a==='anom'?'yellow':'red';sn.val=a==='normal'?sn.normal:a==='anom'?sn.warnV:sn.faultV;sn.code=a==='fault'?(code||''):'';sn.last=now();rec(sn);
if(a==='fault')autoTk(sn);else if(a==='normal'&&S.tickets.some(x=>x.asset===sn.asset&&isOpen(x)))toast(t('normal_note'))}
save();closeM();render()}
function autoTk(sn){const rule=sn.type==='leak'?'leak':'fault',ex=S.tickets.find(x=>x.asset===sn.asset&&x.rule===rule&&isOpen(x)),cd=sn.code?sn.code+' – '+codeDesc(sn):'';
if(ex){ex.sig++;ev(ex,'signal','system',cd);toast(t('ev_signal')+' → '+ex.ref);return}
const a=S.assets.find(x=>x.id===sn.asset),crit=rule==='leak'||/مصعد|سلم/.test(a.type);const x=newTicket({title:t(rule==='leak'?'auto_leak':'auto_fault')+': '+a.name,desc:sn.name+(cd?' · '+cd:''),asset:a.id,prio:crit?'critical':'high',source:'sensor',rule,by:'system'});toast(t('auto_tk')+' '+x.ref)}

function perBar(){const p=ui.per;let inp='';
if(p.mode==='day')inp=`<input type="date" value="${p.d}" onchange="ui.per.d=this.value||ui.per.d;render()">`;
if(p.mode==='month')inp=`<input type="month" value="${p.m}" onchange="ui.per.m=this.value||ui.per.m;render()">`;
if(p.mode==='year'){const y=new Date().getFullYear();inp=`<select onchange="ui.per.y=this.value;render()">${[0,1,2,3,4,5].map(i=>y-i).map(v=>`<option${v==p.y?' selected':''}>${v}</option>`).join('')}</select>`}
if(p.mode==='cal')inp=`<label>${t('from')}</label><input type="date" value="${p.f}" onchange="ui.per.f=this.value||ui.per.f;render()"><label>${t('to')}</label><input type="date" value="${p.t}" onchange="ui.per.t=this.value||ui.per.t;render()">`;
return `<div class="card noprint"><div class="chips">${['day','month','year','cal'].map(x=>`<button class="chip ${p.mode===x?'on':''}" onclick="ui.per.mode='${x}';render()">${t(x==='cal'?'calendar':x)}</button>`).join('')}</div>${inp}</div>`}
function range(){const p=ui.per,pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d||1)};let a,b;
if(p.mode==='day'){a=pd(p.d);b=new Date(a);b.setDate(b.getDate()+1)}else if(p.mode==='month'){a=pd(p.m+'-01');b=new Date(a.getFullYear(),a.getMonth()+1,1)}else if(p.mode==='year'){a=new Date(+p.y,0,1);b=new Date(+p.y+1,0,1)}else{a=pd(p.f);b=pd(p.t);b.setDate(b.getDate()+1);if(b<=a)b=new Date(a.getTime()+864e5)}return [a.getTime(),b.getTime()]}
function perLabel(){const [a,b]=range();return fmt(a,{dateStyle:'medium'})+' – '+fmt(b-1,{dateStyle:'medium'})}
function wAt(ts){let w=S.wHist[0].w;S.wHist.forEach(h=>{if(h.from<=ts)w=h.w});return w}
const grade=s=>s>=95?'g1':s>=85?'g2':s>=75?'g3':s>=60?'g4':'g5';
function evalHTML(L,end){const T=now(),W=wAt(Math.min(end,T));L=L.filter(x=>x.status!=='cancelled');
const rE=L.filter(x=>x.respondedAt||T>rd(x)),rO=rE.filter(x=>x.respondedAt&&x.respondedAt<=rd(x)),sE=L.filter(x=>x.doneAt||T>sd(x)),sO=sE.filter(x=>x.doneAt&&x.doneAt<=sd(x)),fE=L.filter(x=>x.status==='closed'||x.rejects>0),fO=fE.filter(x=>x.status==='closed'&&!x.rejects),cE=L.filter(x=>x.status==='closed'||x.reopens>0),cO=cE.filter(x=>x.status==='closed'&&!x.reopens);
const I=[['k_resp',W.resp,rO.length,rE.length,1],['k_res',W.res,sO.length,sE.length,1],['k_ftf',W.ftf,fO.length,fE.length,0],['k_rec',W.rec,cO.length,cE.length,0]];
const rows=I.map(([k,w,n,d])=>`<tr><td>${t(k)} (${w})</td><td><b>${d?Math.round(n/d*1000)/10+'%':'—'}</b></td><td class="sub">${n} ${t('denom')} ${d}</td></tr>`).join('');let out;
if(I.some(x=>x[4]&&!x[3]))out=`<span class="badge x">${t('no_eval')}</span>`;else{const U=I.filter(x=>x[3]),sw=U.reduce((s,x)=>s+x[1],0),sc=sw?U.reduce((s,x)=>s+x[2]/x[3]*100*x[1],0)/sw:0,blk=L.some(x=>x.prio==='critical'&&isOpen(x)&&T>sd(x)),g=grade(sc);
out=`<div>${t('raw')}: <b>${sc.toFixed(1)}</b> / 100 – ${t(g)}</div>${U.length<4?`<div class="sub">${t('reweighted')}</div>`:''}<div style="margin-top:4px">${t('verdict')}: <span class="badge ${blk?'r':gCls[g]}">${t(blk?'g5':g)}</span></div>${blk?`<div class="err">${t('crit_block')}</div>`:''}`}
return `<h3>${t('eval')}</h3><div class="card"><table>${rows}</table><div style="margin-top:8px">${out}</div></div>`}
function repHTML(){const [a,b]=range(),T=now(),L=S.tickets.filter(x=>x.createdAt>=a&&x.createdAt<b),cnt=s=>L.filter(x=>x.status===s).length,rs=L.filter(x=>x.respondedAt).map(x=>x.respondedAt-x.createdAt),dn=L.filter(x=>x.doneAt).map(x=>x.doneAt-x.createdAt),avg=v=>v.length?dur(v.reduce((s,x)=>s+x,0)/v.length):'—',iss=S.ledger.filter(l=>l.type==='issue'&&l.ts>=a&&l.ts<b).length,val=S.ledger.filter(l=>l.type==='receive'&&l.ts>=a&&l.ts<b).reduce((s,l)=>s+(l.val||0),0);
return `<div class="printhead"><div style="display:flex;align-items:center;gap:8px">${logo(40,'#1B2A41')}<b style="font-size:20px">DARIA</b></div><div>${esc(S.facility)} – ${t('reports')}</div></div><div class="card"><div>${t('period')}: <b>${perLabel()}</b></div><div class="sub">${t('generated')}: ${fmt(T)} · ${esc(uname(S.user))}</div></div>
<div class="card"><table><tr><td>${t('count')}</td><td><b>${L.length}</b></td></tr>${ST.map(s=>`<tr><td>${t('st_'+s)}</td><td>${cnt(s)}</td></tr>`).join('')}<tr><td>${t('overdue')}</td><td>${L.filter(x=>isOpen(x)&&late(x)).length}</td></tr><tr><td>${t('avg_resp')}</td><td>${avg(rs)}</td></tr><tr><td>${t('avg_res')}</td><td>${avg(dn)}</td></tr><tr><td>${t('mv_issue')}</td><td>${iss}</td></tr><tr><td>${t('spend')}</td><td>${val.toFixed(2)} ${t('sar')}</td></tr></table></div>${can('evaluate')?evalHTML(L,b):''}
<h3>${t('nav_tk')}</h3><div class="card"><table><tr><th>#</th><th>${t('f_title')}</th><th>${t('f_prio')}</th><th>${t('status')}</th></tr>${L.map(x=>`<tr><td>${esc(x.ref)}</td><td>${esc(x.title)}</td><td>${t('p_'+x.prio)}</td><td>${t('st_'+x.status)}</td></tr>`).join('')||`<tr><td colspan="4">${t('none')}</td></tr>`}</table></div>`}
function doPrint(h){const p=$('#printArea');p.innerHTML=h;tick();document.body.classList.add('printing');setTimeout(()=>{window.print();setTimeout(()=>document.body.classList.remove('printing'),800)},80)}
function printRep(){if(!guard('print'))return;audit('print',perLabel());save();doPrint(repHTML())}
function printTk(id){if(!guard('print'))return;const x=gT(id);audit('print',x.ref);save();doPrint(`<div class="printhead"><div style="display:flex;align-items:center;gap:8px">${logo(40,'#1B2A41')}<b style="font-size:20px">DARIA</b></div><div>${esc(S.facility)} – ${esc(x.ref)} · ${t('generated')}: ${fmt(now())}</div></div>${tkBody(x)}<h3>${t('events')}</h3>${tlHTML(x)}`)}

function bellM(){const L=myNotifs();L.forEach(n=>{if(!n.read.includes(S.user))n.read.push(S.user)});save();updBell();showM(`<div class="row"><h2 style="flex:1">${t('notifs')}</h2>${closeX}</div>${L.slice(0,60).map(n=>`<div class="item" onclick="openN('${n.id}')"><b>${t('ev_'+n.k)}</b> – ${esc(n.ref)}<div class="sub">${fmt(n.ts)}</div></div>`).join('')||noneC()}`)}
function openN(id){const n=S.notifs.find(x=>x.id===id),x=S.tickets.find(y=>y.ref===n.ref);if(x&&visT(x)){openTk(x.id);return}if(/^P[RO]-/.test(n.ref))go('buy');else if(/^IR-/.test(n.ref))go('store');else go('sensors')}
function setLang(l){S.lang=l;save();render()}
function setUser(u){S.user=u;save();closeM();render()}
function facForm(){formM(t('edit_fac'),[{id:'n',lb:t('f_name'),val:S.facility,req:1}],v=>{S.facility=v.n;audit('settings','facility')})}
function whForm(){formM(t('edit_wh'),S.warehouses.map(w=>({id:w.id,lb:w.id,val:w.name,req:1})),v=>{S.warehouses.forEach(w=>w.name=v[w.id]);audit('settings','warehouses')})}
function userForm(){formM(t('add_user'),[{id:'n',lb:t('f_name'),req:1},{id:'r',lb:t('role'),opts:Object.entries(S.roles).map(([k,r])=>[k,r.name])}],v=>{S.users.push({id:uid(),name:v.n,role:v.r});audit('user_add',v.n)})}
function slaForm(){const F=[];PRI.forEach(p=>{F.push({id:p+'_r',lb:t('p_'+p)+' – '+t('resp_due')+' ('+t('minutes')+')',type:'number',val:S.sla[p][0],req:1});F.push({id:p+'_s',lb:t('p_'+p)+' – '+t('res_due')+' ('+t('minutes')+')',type:'number',val:S.sla[p][1],req:1})});formM(t('sla_btn')+' – '+t('sla_note'),F,v=>{for(const p of PRI)if(!(v[p+'_r']>0&&v[p+'_s']>0))return t('need_fields');PRI.forEach(p=>S.sla[p]=[v[p+'_r'],v[p+'_s']]);audit('settings','SLA')})}
function wForm(){const w=S.wHist[S.wHist.length-1].w;formM(t('weights'),[['resp','k_resp'],['res','k_res'],['ftf','k_ftf'],['rec','k_rec']].map(([id,k])=>({id,lb:t(k),type:'number',val:w[id],req:1})),v=>{if(v.resp+v.res+v.ftf+v.rec!==100)return t('w_sum');S.wHist.push({from:now(),w:{resp:v.resp,res:v.res,ftf:v.ftf,rec:v.rec}});audit('settings','weights')})}
function exportB(){if(!guard('*'))return;const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='daria-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function importB(inp){if(!guard('*'))return;const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.v!==1||!Array.isArray(d.tickets)||!d.roles)throw 0;if(!confirm(t('confirm_restore')))return;S=d;audit('restore','');save();render();toast(t('saved'))}catch(e){toast(t('bad_file'))}};r.readAsText(f)}
function resetD(){if(!guard('*'))return;if(!confirm(t('confirm_reset')))return;const l=S.lang;S=seed();S.lang=l;audit('reset','');save();render()}

(function init(){try{localStorage.setItem('_t','1');localStorage.removeItem('_t')}catch(e){STORE_OK=false}
try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){S=null}if(!S||S.v!==1){S=seed();save()}
const d=new Date(),ds=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;ui.per={mode:'month',d:ds,m:ds.slice(0,7),y:String(d.getFullYear()),f:ds.slice(0,8)+'01',t:ds};
$('#brand').innerHTML=logo(30,'#fff')+'<span>DARIA</span>';$('#langSel').onchange=e=>setLang(e.target.value);$('#userSel').onchange=e=>setUser(e.target.value);$('#bell').onclick=bellM;$('#modal').onclick=e=>{if(e.target.id==='modal')closeM()};
escCheck();render();setInterval(tick,1000);setInterval(escCheck,20000)})();
</script>
</body>
</html>
